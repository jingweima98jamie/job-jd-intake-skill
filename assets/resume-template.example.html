<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人简历</title>
    <style>
        * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        :root {
            --accent-color: #c04848;
            --accent-bg-light: #fdf6f6;
            --text-dark: #333333;
            --text-light: #666666;
            --border-color: #eeeeee;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "Arial", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: #fff;
            color: var(--text-dark);
            font-size: 15px;
            line-height: 1.42;
            padding: 22px 32px;
        }
        .resume-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 14px;
            position: relative;
        }
        .header-info h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-dark);
        }
        .header-info h1 span {
            font-weight: 400;
            font-size: 16px;
            color: var(--text-light);
            margin-left: 8px;
        }
        .header-info p {
            color: var(--text-light);
            font-size: 13px;
            line-height: 1.45;
            margin-top: 2px;
        }
        .photo-wrapper { position: absolute; top: -2px; right: 0px; }
        .photo {
            width: 92px;
            height: 92px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center 20%;
            border: 3px solid #fff;
            box-shadow: 0 0 8px rgba(0,0,0,0.08);
            position: relative;
            z-index: 2;
        }
        .section { margin-bottom: 12px; }
        .section-title-wrapper {
            display: flex;
            align-items: center;
            background-color: var(--accent-bg-light);
            padding: 3px 8px;
            margin-bottom: 7px;
        }
        .title-bar {
            width: 4px;
            height: 16px;
            background-color: var(--accent-color);
            margin-right: 7px;
        }
        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: var(--accent-color);
        }
        .section-content { padding-left: 10px; }
        .entry { margin-bottom: 8px; }
        .entry-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1px;
        }
        .entry-title { font-size: 14.5px; font-weight: bold; }
        .entry-meta {
            font-size: 12px;
            color: var(--text-light);
            text-align: right;
            flex-shrink: 0;
            padding-left: 10px;
        }
        .entry-subtitle {
            font-weight: bold;
            color: var(--text-dark);
            margin-bottom: 3px;
        }
        .entry-subtitle a { color: var(--accent-color); text-decoration: none; }
        .entry-content ul {
            list-style-position: outside;
            padding-left: 14px;
        }
        .entry-content li {
            margin-bottom: 2px;
            color: var(--text-light);
        }
        .other-info p { color: var(--text-light); margin-bottom: 2px; }
        .other-info p strong { color: var(--text-dark); }
    </style>
</head>
<body>

    <header class="resume-header">
        <div class="header-info">
            <h1>【你的名字】<span>求职意向：【目标岗位】</span></h1>
            <p>【手机号】 ｜ 【邮箱】</p>
            <p>【一行卖点，控制在 40 字内，太长会压到右上角照片】</p>
        </div>
        <div class="photo-wrapper">
            <img class="photo" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240' viewBox='0 0 240 240'><rect width='240' height='240' fill='%23e9e9e6'/><circle cx='120' cy='92' r='44' fill='%23b4b2a9'/><path d='M52 212c0-38 30-62 68-62s68 24 68 62z' fill='%23b4b2a9'/></svg>" alt="photo">
        </div>
    </header>

    <main class="resume-body">

        <section class="section">
            <div class="section-title-wrapper">
                <div class="title-bar"></div>
                <h2 class="section-title">教育背景</h2>
            </div>
            <div class="section-content">
                <div class="entry">
                    <div class="entry-header">
                        <h3 class="entry-title">【学校】 ｜ 【专业】（【学历】）</h3>
                        <div class="entry-meta">【起止时间】</div>
                    </div>
                </div>
                <div class="entry">
                    <div class="entry-header">
                        <h3 class="entry-title">【学校】 ｜ 【专业】（【学历】）</h3>
                        <div class="entry-meta">【起止时间】</div>
                    </div>
                </div>
            </div>
        </section>

        <section class="section">
            <div class="section-title-wrapper">
                <div class="title-bar"></div>
                <h2 class="section-title">个人总结</h2>
            </div>
            <div class="section-content other-info">
                <p>【由生成器按 JD 覆盖，母版里这段只是占位】</p>
            </div>
        </section>

        <section class="section">
            <div class="section-title-wrapper">
                <div class="title-bar"></div>
                <h2 class="section-title">工作经历</h2>
            </div>
            <div class="section-content">
                <div class="entry">
                    <div class="entry-header">
                        <h3 class="entry-title">【公司】 ｜ 【岗位】</h3>
                        <div class="entry-meta">【起止时间】 ｜ 【城市】</div>
                    </div>
                    <p class="entry-subtitle">【一句话职责】</p>
                    <div class="entry-content">
                        <ul>
                            <li>【这里的内容由 spec.json 覆盖，母版里只是占位】</li>
                        </ul>
                    </div>
                </div>
            </div>
        </section>

        <section class="section">
            <div class="section-title-wrapper">
                <div class="title-bar"></div>
                <h2 class="section-title">项目经历</h2>
            </div>
            <div class="section-content">
                <div class="entry">
                    <div class="entry-header">
                        <h3 class="entry-title">【项目名】</h3>
                        <div class="entry-meta">【时间】</div>
                    </div>
                    <div class="entry-content">
                        <ul>
                            <li>【占位】</li>
                        </ul>
                    </div>
                </div>
            </div>
        </section>

        <section class="section">
            <div class="section-title-wrapper">
                <div class="title-bar"></div>
                <h2 class="section-title">专业技能</h2>
            </div>
            <div class="section-content other-info">
                <p>【占位】</p>
            </div>
        </section>

    </main>

</body>
</html>
